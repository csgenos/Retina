name: Build Retina

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retina-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend-neutral module needs only Maven Central, so it is the signal that stays
  # available when maven.fabricmc.net, libraries.minecraft.net or piston-meta.mojang.com are
  # unreachable. It is also where the translator, preprocessor and std140 tests live, which is
  # the coverage most likely to catch a regression.
  core:
    name: Test retina-core
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Defensive: the wrapper is tracked executable, but a checkout through a tool that drops
      # the mode bit would otherwise fail with an unexplained "Permission denied".
      - name: Ensure the wrapper is executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build -Pretina.coreOnly=true --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: retina-core-test-report-${{ github.sha }}
          path: retina-core/build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build Fabric JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure the wrapper is executable
        run: chmod +x gradlew

      - name: Build and verify release JAR
        run: ./gradlew :retina-fabric:build --no-daemon

      - name: Upload Retina JAR
        uses: actions/upload-artifact@v4
        with:
          name: retina-build-${{ github.sha }}
          path: |
            retina-fabric/build/libs/retina-*.jar
            !retina-fabric/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
