name: Build Retina

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retina-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Fabric JAR
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify release JAR
        run: ./gradlew :retina-fabric:build --no-daemon

      - name: Upload Retina JAR
        uses: actions/upload-artifact@v4
        with:
          name: retina-build-${{ github.sha }}
          path: |
            retina-fabric/build/libs/retina-*.jar
            !retina-fabric/build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 30
